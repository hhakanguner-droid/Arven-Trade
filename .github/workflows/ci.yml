name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase13:
    name: phase13 web API gate (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Phase 13 web stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Run Phase 13 web API tests
        run: pytest -q tests/test_web_api_phase13.py
      - name: Lint Phase 13 surface
        run: |
          ruff check \
            tradingagents/service \
            tests/test_web_api_phase13.py

  phase12:
    name: phase12 production hardening gate (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Phase 12 production regression suite
        run: |
          pytest -q \
            tests/test_production_hardening_phase12.py \
            tests/test_production_runtime_phase12.py \
            tests/test_production_credentials_phase12.py \
            tests/test_production_acceptance_phase12.py
      - name: Lint Phase 12 surface
        run: |
          ruff check \
            tradingagents/operations \
            tests/test_production_hardening_phase12.py \
            tests/test_production_runtime_phase12.py \
            tests/test_production_credentials_phase12.py \
            tests/test_production_acceptance_phase12.py

  phase11:
    name: phase11 targeted gate (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Phase 11 regression suite
        run: |
          pytest -q \
            tests/test_analysis_history.py \
            tests/test_analysis_history_tracker.py \
            tests/test_analysis_history_review_phase11.py \
            tests/test_analysis_history_cli_phase11.py \
            tests/test_env_overrides.py \
            tests/test_kap_graph_integration.py
      - name: Lint Phase 11 surface
        run: |
          ruff check \
            tradingagents/history \
            tradingagents/default_config.py \
            tradingagents/graph/setup.py \
            tradingagents/graph/trading_graph.py \
            tests/conftest.py \
            tests/test_analysis_history.py \
            tests/test_analysis_history_tracker.py \
            tests/test_analysis_history_review_phase11.py \
            tests/test_analysis_history_cli_phase11.py \
            tests/test_env_overrides.py

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import tradingagents, cli.main, tradingagents.operations; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        run: ruff check .

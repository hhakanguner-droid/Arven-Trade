name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase11:
    name: phase11 targeted gate (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Phase 11 regression suite
        run: |
          pytest -q \
            tests/test_analysis_history.py \
            tests/test_analysis_history_tracker.py \
            tests/test_analysis_history_review_phase11.py \
            tests/test_analysis_history_cli_phase11.py \
            tests/test_env_overrides.py \
            tests/test_kap_graph_integration.py
      - name: Lint Phase 11 surface
        run: |
          ruff check \
            tradingagents/history \
            tradingagents/default_config.py \
            tradingagents/graph/setup.py \
            tradingagents/graph/trading_graph.py \
            tests/conftest.py \
            tests/test_analysis_history.py \
            tests/test_analysis_history_tracker.py \
            tests/test_analysis_history_review_phase11.py \
            tests/test_analysis_history_cli_phase11.py \
            tests/test_env_overrides.py

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # Keep the repository-wide gate visible even while legacy Phase 10
        # baseline debt is being tracked separately from the Phase 11 gate.
        run: ruff check .
